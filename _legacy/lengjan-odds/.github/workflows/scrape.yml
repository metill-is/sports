name: Scrape Lengjan Odds

on:
  schedule:
    # 3x daily: 08:00, 14:00, 20:00 UTC (roughly 08, 14, 20 GMT)
    - cron: '0 8,14,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::targets, any::chromote

      - name: Restore targets cache
        uses: actions/cache@v4
        with:
          path: _targets
          key: targets-${{ hashFiles('_targets.R', 'R/**') }}
          restore-keys: targets-

      - name: Run pipeline
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        timeout-minutes: 30
        run: |
          Rscript -e 'targets::tar_make()'

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ config/
          git diff --cached --quiet || git commit -m "odds: $(date -u +%Y-%m-%dT%H:%M)"
          git push
