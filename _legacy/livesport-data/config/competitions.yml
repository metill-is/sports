# Livesport Data Scraper — Competition Registry
#
# Each entry defines a competition group scraped from livesport.com.
# The scraper fetches current-season results + schedule for each league.
#
# Two-tier scraping:
#   leagues / divisions           — scraped daily (CI)
#   historical_leagues / historical_divisions — scraped in "full" mode only (preseason)
#
# Set LIVESPORT_MODE=full to include historical leagues (default: daily).
#
# Fields:
#   livesport_sport: URL path segment (soccer, handball)
#   country:         URL path segment
#   url_type:        season_range ({name}-{start}-{end}) or single_year ({name}-{year})
#   team_selectors:  CSS selectors for team names (football vs handball differ)
#   pagination:      CSS selector for "show more" button
#   sex:             list of sexes (for flat league lists)
#   leagues:         flat list of league URL slugs (football) — daily
#   historical_leagues: additional leagues scraped in full mode only
#   divisions:       nested by sex → list of {name, label} (handball) — daily
#   historical_divisions: additional divisions scraped in full mode only

defaults:
  page_wait: 10       # seconds after page load
  click_wait: 5        # seconds between pagination clicks
  between_pages: 5     # seconds between different pages

# ── Football ──────────────────────────────────────────────────────────────────

football_england:
  livesport_sport: soccer
  country: england
  url_type: season_range
  team_selectors: football
  pagination: ".wclButtonLink"
  sex: [male]
  leagues:
    - premier-league
    - championship
  historical_leagues:
    - league-one
    - league-two
    - fa-cup
    - efl-cup

