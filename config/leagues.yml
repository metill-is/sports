# config/leagues.yml — single source of truth for league metadata.
#
# Currently configured for the three active Icelandic leagues (Plan 1 scope).
# Non-Icelandic leagues are preserved in _legacy/ and will be re-added when
# revived in later plans.
#
# team_names direction: {canonical: Lengjan_display_name}.
# Migrated from _legacy/sports/config/leagues.yml +
# _legacy/lengjan-odds/config/competitions.yml +
# _legacy/lengjan-odds/config/team_names_{sport}_iceland.csv.

basketball_iceland:
  sport: basketball
  country: iceland
  sexes: [male, female]
  active: true
  data_source:
    results: kki_basketball
    schedule: kki_basketball
    odds: lengjan_odds
  lengjan:
    competitions:
      # 2026-04-28: Lengjan restructured kvenna efri/neðri (30774/30773) into a
      # single playoff umbrella per sex. Old IDs now return empty placeholder
      # pages (identical char count, no team hits). Men's Bónusdeild is now
      # also on Lengjan (was missing at migration time).
      - { id: "1519", name: "Bónusdeild karla úrslitakeppni", sex: male }
      - { id: "1528", name: "Bónusdeild kvenna úrslitakeppni", sex: female }
    team_names:
      # Men's úrslitakeppni (id 1519). Lengjan uses bare team names for the
      # men's draw — verified against data/facts/odds 2026-04-29 scrape.
      male:
        Grindavík: Grindavík
        Valur: Valur
        Tindastóll: Tindastóll
        Stjarnan: Stjarnan
        Haukar: Haukar
        Njarðvík: Njarðvík
        Keflavík: Keflavík
        Ármann: Ármann
      female:
        Grindavík: Grindavík kv
        Valur: Valur kv
        Njarðvík: Njarðvík kv
        Haukar: Haukar kv
        Keflavík: Keflavík kv
        Tindastóll: UMF Tindastoll kv
        Ármann: Ármann kv
        Stjarnan: Stjarnan kv
  stan_model: basketball_iceland/2d_student_t_scalarsigma.stan
  betting:
    # kelly_frac is the §7.2 multiplicative shrinkage (Browne γ for finite-
    # horizon power utility). Iceland-tier ROI history (+9.18 % per
    # Sports/Knowledge/Betting Optimisation/Historical/roi-snapshot-2026-04-19)
    # supports moderate confidence; female cell tighter on smaller sample.
    # 2026-05-02: scaled to 25 % of Browne defaults (user request — overall
    # 75 % stake reduction). Pre-cut: male 0.20, female 0.15.
    kelly_frac:
      male: 0.05
      female: 0.0375
    # Per-match solver cap; rarely binds for typical raw Kelly fractions
    # (1-5 %) so the §7.2 shrinkage and §10 portfolio scaling are the
    # active stake limiters.
    max_match_stake: 0.50
    ev_threshold: 0.0
    markets:
      moneyline: true
      spread: true
      total: true
    scoring:
      has_ties: false
      tie_threshold: 0
    min_bet: 200
    max_age_hours: 48

handball_iceland:
  sport: handball
  country: iceland
  sexes: [male, female]
  active: true
  data_source:
    results: hsi_handball
    schedule: hsi_handball
    odds: lengjan_odds
  lengjan:
    competitions:
      - { id: "1269", name: "Olísdeild karla", sex: male }
    team_names:
      male:
        Þór: Þór
        HK: HK
        ÍBV: ÍBV
        ÍR: ÍR
        FH: FH
        KA: KA
        ÍH: ÍH Keflavík
        HBH: HB Hafnarfjörður
        Valur: Valur
      female: {}                       # No women's handball on Lengjan currently
  stan_model: handball_iceland/2d_student_t.stan
  betting:
    # 2026-05-02: scaled to 25 % of Browne default (user request — overall
    # 75 % stake reduction). Pre-cut: 0.20.
    kelly_frac: 0.05         # §7.2 multiplicative shrinkage; quarter-of-Browne
    max_match_stake: 0.50    # solver cap; rarely binds
    ev_threshold: 0.0
    markets:
      moneyline: true
      spread: true
      total: true
    scoring:
      has_ties: true
      tie_threshold: 0.5
    min_bet: 200
    max_age_hours: 48

football_iceland:
  sport: football
  country: iceland
  sexes: [male, female]
  active: true
  data_source:
    results: ksi_football
    schedule: ksi_football
    odds: lengjan_odds
  lengjan:
    competitions:
      - { id: "746",   name: "Besta Deildin",            sex: male   }
      - { id: "20443", name: "Besta Deildin Efri Hluti", sex: male   }
      - { id: "20442", name: "Besta Deildin Neðri Hluti", sex: male   }
      - { id: "757",   name: "Lengjudeildin",            sex: male   }
      - { id: "813",   name: "Mjólkurbikar karla",       sex: male   }
      - { id: "1581",  name: "2. deild karla",           sex: male   }
      - { id: "1568",  name: "Besta deild kvenna",       sex: female }
    team_names:
      male:
        # Existing LD1 + men-only sex-disjoint entries:
        Þór: Þór Ak.
        Víkingur R.: Víkingur Rvk
        Þróttur R.: Þróttur Rvk
        Leiknir R.: Leiknir Rvk
        Ægir: Ægir
        ÍR: ÍR
        Grótta: Grótta
        Grindavík: Grindavík
        Njarðvík: Njarðvík
        Völsungur: Völsungur
        Fylkir: Fylkir
        Vestri: Vestri
        # 2. deild karla teams. Most canonical == Lengjan rendering; two
        # diverge — see Víkingur Ó./Þróttur V. below. Confirmed names verified
        # against data/facts/odds/sport=football/country=iceland (scraped via
        # competition id 1581); unconfirmed teams use identity guess (KSÍ
        # schedule has them in LD2 but no Lengjan odds yet).
        KFG: KFG                       # confirmed
        Magni: Magni                   # confirmed
        Dalvík/Reynir: Dalvík/Reynir   # confirmed (no spaces around slash)
        KFA: KFA                       # confirmed
        Kormákur/Hvöt: Kormákur/Hvöt   # confirmed (no spaces around slash)
        Selfoss: Selfoss               # confirmed
        Víkingur Ó.: Víkingur Ól.      # confirmed — Lengjan uses "Ól.", KSÍ "Ó."
        Þróttur V.: Þróttur Vogum      # confirmed — Lengjan uses full village name
        Fjölnir: Fjölnir               # identity guess; verify on first odds appearance
        Haukar: Haukar                 # identity guess; verify on first odds appearance
        Hvíti riddarinn: Hvíti riddarinn  # identity guess; verify on first odds appearance
        Kári: Kári                     # identity guess; verify on first odds appearance
        # Additional men's teams surfacing in 2026-05-17 Lengjudeildin fixtures
        # (canonical == Lengjan rendering; verified against
        # data/facts/odds/sport=football/country=iceland).
        HK: HK
        Afturelding: Afturelding
        # BD teams that also appear in women's BD (verified against
        # data/facts/odds/sport=football/country=iceland):
        KR: KR
        FH: FH
        Stjarnan: Stjarnan
        Valur: Valur
        Fram: Fram
        ÍBV: ÍBV
        Breiðablik: Breiðablik
        Keflavík: Keflavík
        ÍA: ÍA
        KA: KA
      female:
        # First women's BD season on Lengjan (Plan 1-era empty map upgraded
        # 2026-05-11 after odds for the first 5 teams appeared in
        # data/facts/odds/sport=football/country=iceland; 2026-05-18 audit
        # added the remaining 5 KSÍ-schedule teams). canonical (matches
        # beliefs/latest) -> Lengjan rendering.
        FH: FH kv                                       # confirmed
        Fram: Fram kv                                   # confirmed
        ÍBV: ÍBV kv                                     # confirmed
        Víkingur R.: Víkingur Rvk kv                    # confirmed
        Þróttur R.: Þróttur Rvk kv                      # confirmed
        Breiðablik: Breiðablik kv                       # confirmed 2026-05-18
        Grindavík/Njarðvík: Grindavík / Njarðvík kv     # confirmed 2026-05-18 — note SPACES around slash on Lengjan side
        Valur: Valur kv                                 # confirmed 2026-05-18
        Stjarnan: Stjarnan kv                           # identity-pattern guess; first fixture 2026-05-20 vs Grindavík/Njarðvík
        Þór/KA: Þór/KA kv                               # identity-pattern guess; first fixture 2026-05-20 vs Breiðablik. Verify on first odds appearance (Lengjan may use spaces — c.f. Grindavík/Njarðvík)
  stan_model: football_iceland/bivariate_poisson_no_inflation.stan
  # Restrict Stan training to teams that have competed in the top four
  # league tiers within the last 365 days. Cuts ~30 amateur/regional teams
  # whose 1-2 cup blowouts (12-1, 10-0, 9-0) introduced funnel-shaped
  # curvature in the posterior — see Knowledge/Sports Models/2026-05-21 —
  # training-filter root cause.md for the full diagnosis. Lengjan doesn't
  # offer odds on LD4 or amateur-cup-only sides, so dropping them aligns
  # the training population with the prediction population.
  training_filter:
    divisions: [BD, BD_UPPER_PO, BD_LOWER_PO, LD1, LD2, LD3]
    lookback_days: 365
  betting:
    # kelly_frac is the §7.2 multiplicative shrinkage. Female cell stays
    # tighter — first Icelandic women's football season, thin history.
    # 2026-05-02: scaled to 25 % of Browne defaults (user request — overall
    # 75 % stake reduction). Pre-cut: male 0.20, female 0.10.
    kelly_frac:
      male: 0.05
      female: 0.025
    max_match_stake: 0.50
    ev_threshold: 0.0
    markets:
      moneyline: true
      spread: true
      total: true
    scoring:
      has_ties: true
      tie_threshold: 0
    min_bet: 200
    max_age_hours: 48
