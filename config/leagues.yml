# Centralised league registry — Sports/config/leagues.yml
#
# Each entry defines a league with its pipeline type, data source,
# Stan model, and per-league overrides. The `defaults` block is
# merged into every league entry by R/pipeline/config.R.
#
# Key fields:
#   pipeline:    shared | football | handball_other
#   data_source: baskethotel | hsi | iceland_ksi | livesport_football | livesport_handball
#   has_bets:    whether this league has a config/bets.yml
#   active:      true/false — inactive leagues are excluded from --all, --active, --stale, --due
#                (explicit --league overrides this)

defaults:
  iter_warmup: 1000
  iter_sampling: 1000
  chains: 4
  parallel_chains: 4
  method: sample

# ── Basketball ──────────────────────────────────────────────────────────────

basketball_iceland:
  sport: basketball
  country: iceland
  dir: basketball/iceland
  sex: [male, female]
  stan_model: 2d_student_t_scalarsigma.stan
  pipeline: shared
  config_module: R/config/basketball_iceland.R
  data_source: baskethotel
  has_bets: true
  active: true
  rproj: basketball_iceland.Rproj

# ── Handball Iceland ────────────────────────────────────────────────────────

handball_iceland:
  sport: handball
  country: iceland
  dir: handball/iceland
  sex: [male, female]
  stan_model: 2d_student_t.stan
  pipeline: shared
  config_module: R/config/handball_iceland.R
  data_source: hsi
  has_bets: true
  active: true
  rproj: handball_iceland.Rproj

# ── Football Iceland ─────────────────────────────────────────────────────────

football_iceland:
  sport: football
  country: iceland
  dir: football/iceland
  sex: [male, female]
  stan_model: bivariate_poisson_no_inflation.stan
  pipeline: football
  data_source: iceland_ksi
  has_bets: true
  active: true
  rproj: football_iceland.Rproj
  league_name: "Úrvalsdeild"
  division_names: ["BD", "LD1", "LD2", "LD3", "LD4"]

