# config/leagues.yml — single source of truth for league metadata.
#
# Currently configured for the three active Icelandic leagues (Plan 1 scope).
# Non-Icelandic leagues are preserved in _legacy/ and will be re-added when
# revived in later plans.
#
# team_names direction: {canonical: Lengjan_display_name}. A value may be a
# single rendering (scalar) or a list of acceptable renderings when Lengjan
# shows the same team under more than one string (first element = primary the
# placer types). Each rendering must come from exactly one canonical (injective).
# Migrated from _legacy/sports/config/leagues.yml +
# _legacy/lengjan-odds/config/competitions.yml +
# _legacy/lengjan-odds/config/team_names_{sport}_iceland.csv.

basketball_iceland:
  sport: basketball
  country: iceland
  sexes: [male, female]
  active: true
  data_source:
    results: kki_basketball
    schedule: kki_basketball
    odds: lengjan_odds
  lengjan:
    competitions: []
    # D2 (2026-09-02): publish-only this season -- competitions emptied so the
    # odds scrape has nothing to fetch, alongside betting.enabled: false below.
    # The schema permits an empty array (competitions has no minItems). Restore
    # these ids when betting resumes; they are last season's playoff umbrella
    # and should be re-verified against Lengjan before use:
    #  # 2026-04-28: Lengjan restructured kvenna efri/neðri (30774/30773) into a
    #  # single playoff umbrella per sex. Old IDs now return empty placeholder
    #  # pages (identical char count, no team hits). Men's Bónusdeild is now
    #  # also on Lengjan (was missing at migration time).
    #  - { id: "1519", name: "Bónusdeild karla úrslitakeppni", sex: male }
    #  - { id: "1528", name: "Bónusdeild kvenna úrslitakeppni", sex: female }
    team_names:
      # Men's úrslitakeppni (id 1519). Lengjan uses bare team names for the
      # men's draw — verified against data/facts/odds 2026-04-29 scrape.
      male:
        Grindavík: Grindavík
        Valur: Valur
        Tindastóll: Tindastóll
        Stjarnan: Stjarnan
        Haukar: Haukar
        Njarðvík: Njarðvík
        Keflavík: Keflavík
        Ármann: Ármann
      female:
        Grindavík: Grindavík kv
        Valur: Valur kv
        Njarðvík: Njarðvík kv
        Haukar: Haukar kv
        Keflavík: Keflavík kv
        Tindastóll: UMF Tindastoll kv
        Ármann: Ármann kv
        Stjarnan: Stjarnan kv
  # Publish cells. No cup division is ingested for basketball: the distinct
  # `division` values in data/facts/results for season 2026 are exactly
  # {BD, 1D}, so every entry is is_cup: false and there is no cup cell.
  #
  # code_badge: "1D" cannot be its own badge -- it starts with a digit and so
  # fails next_games.json::division_code's ^[A-Z][A-Z0-9_]*$. BON keeps
  # basketball's Bonusdeild off football's BD filter key on metill-platform.
  #
  # expected_meetings measured from data/facts/results season 2026 (see below
  # per cell). It is an assertion and a fallback, never the source: n_rounds is
  # derived from schedule + results. When a federation changes format this goes
  # red in tests/testthat/test-iceland-division-helpers.R -- re-measure and
  # rewrite the constant rather than loosening the test.
  #
  # No `qualify` key for either sex. Measured teams reaching the 2026
  # post-season: male BD 8 of 12, male 1D 8 of 12, female BD 10 of 10, female
  # 1D 4 of 11 -- four cells, four structures, and women's Bonusdeild carries
  # every team through, so no single per-division integer expresses it
  # (Plan B ID-B15). Absent = meta.qualify null and no p_qualify.
  # relegation_slots is likewise omitted: no KKI regulation was resolved for it
  # this session, and an unresolved number is omitted rather than guessed.
  publish_divisions:
    male:
      # BD: 12 teams, cut at round <= 22 -> 132 matches, all 66 pairs exactly 2x.
      # 1D: 12 teams, cut at round <= 22 -> 132 matches, all 66 pairs exactly 2x.
      - { code: BD, slug: bd, label_is: "Bónusdeild", is_cup: false,
          code_badge: BON, expected_meetings: 2 }
      - { code: 1D, slug: 1d, label_is: "1. deild",    is_cup: false,
          code_badge: B1D, expected_meetings: 2 }
    female:
      # BD: 10 teams, cut at round <= 18 -> 90 matches, all 45 pairs exactly 2x.
      # 1D: expected_meetings cannot express this cell, so the boundary is
      # STATED as regular_season_rounds instead. Measured on data/facts/results
      # season 2026 (2026-09-05): rounds 1-18 are 89 matches over 10 teams
      # (44 pairs 2x + 1 pair 1x); rounds 19-24 are a 4-team promotion playoff
      # -- Þór Ak. v Fjölnir and Hamar/Þór v Selfoss, then Hamar/Þór v
      # Fjölnir -- which brings in an ELEVENTH team, Hamar/Þór, who plays no
      # regular round at all. So expected_meetings * (n_teams - 1) is wrong in
      # both directions, and the schedule fallback published the playoff AS the
      # regular season: n_rounds 24, and meta.round 6 (the floor over
      # appearances, i.e. Hamar/Þór's 6 playoff games) for a finished season.
      # With the boundary stated: 98 rows -> 89, n_rounds 18, meta.round 17.
      # Re-measured by tests/testthat/test-iceland-division-helpers.R against
      # live data/facts/results -- when KKÍ changes the format that goes red,
      # and the fix is to re-measure the constant, not to loosen the test.
      - { code: BD, slug: bd, label_is: "Bónusdeild", is_cup: false,
          code_badge: BON, expected_meetings: 2 }
      - { code: 1D, slug: 1d, label_is: "1. deild",    is_cup: false,
          code_badge: B1D, regular_season_rounds: 18 }
  stan_model: basketball_iceland/2d_student_t_scalarsigma.stan
  betting:
    # D2 (2026-09-02): publish-only. Enforced at four layers via
    # betting_enabled() -- odds ingest, decide, the placer loader and its
    # pre-flight. Absent means enabled, so football is untouched.
    enabled: false
    # kelly_frac is the §7.2 multiplicative shrinkage (Browne γ for finite-
    # horizon power utility). Iceland-tier ROI history (+9.18 % per
    # Sports/Knowledge/Betting Optimisation/Historical/roi-snapshot-2026-04-19)
    # supports moderate confidence; female cell tighter on smaller sample.
    # 2026-05-02: scaled to 25 % of Browne defaults (user request — overall
    # 75 % stake reduction). Pre-cut: male 0.20, female 0.15.
    kelly_frac:
      male: 0.05
      female: 0.0375
    # Per-match solver cap; rarely binds for typical raw Kelly fractions
    # (1-5 %) so the §7.2 shrinkage and §10 portfolio scaling are the
    # active stake limiters.
    max_match_stake: 0.50
    ev_threshold: 0.0
    markets:
      moneyline: true
      spread: true
      total: true
    scoring:
      has_ties: false
      tie_threshold: 0
    min_bet: 200
    max_age_hours: 48

handball_iceland:
  sport: handball
  country: iceland
  sexes: [male, female]
  active: true
  data_source:
    results: hsi_handball
    schedule: hsi_handball
    odds: lengjan_odds
  lengjan:
    competitions: []
    # D2 (2026-09-02): publish-only this season -- see basketball_iceland above.
    # Restore when betting resumes:
    #  - { id: "1269", name: "Olísdeild karla", sex: male }
    team_names:
      male:
        Þór: Þór
        HK: HK
        ÍBV: ÍBV
        ÍR: ÍR
        FH: FH
        KA: KA
        ÍH: ÍH Keflavík
        HBH: HB Hafnarfjörður
        Valur: Valur
      female: {}                       # No women's handball on Lengjan currently
  # Publish cells. Handball ingests a third division, PO, which is the shared
  # post-season bracket rather than a league -- it is NOT a publish division and
  # is deliberately absent here. No cup division is ingested, so both entries
  # are is_cup: false and there is no cup cell.
  #
  # No `qualify` key: see the basketball block above (Plan B ID-B15). Measured
  # 2026 post-season entrants are 8 (male) and 6 (female), but they enter a
  # separate PO division rather than a top-N cut of this table.
  # relegation_slots omitted -- no HSI regulation resolved this session.
  publish_divisions:
    male:
      # OD:  12 teams, cut at round <= 22 -> 132 matches, all 66 pairs exactly 2x.
      # G66: 12 teams, cut at round <= 22 -> 132 matches, all 66 pairs exactly 2x.
      - { code: OD,  slug: od,  label_is: "Olísdeild",     is_cup: false,
          code_badge: OD,  expected_meetings: 2 }
      - { code: G66, slug: g66, label_is: "Grill 66-deild", is_cup: false,
          code_badge: G66, expected_meetings: 2 }
    female:
      # TRIPLE round robin, both divisions: 8 teams, cut at round <= 21 -> 84
      # matches, all 28 pairs exactly 3x. This is the cell that breaks the
      # 2*(n_teams - 1) assumption -- measured 2026-09-04 from
      # data/facts/results, not assumed (Plan B ID-B14).
      - { code: OD,  slug: od,  label_is: "Olísdeild",     is_cup: false,
          code_badge: OD,  expected_meetings: 3 }
      - { code: G66, slug: g66, label_is: "Grill 66-deild", is_cup: false,
          code_badge: G66, expected_meetings: 3 }
  stan_model: handball_iceland/2d_student_t.stan
  betting:
    # D2 (2026-09-02): publish-only. Enforced at four layers via
    # betting_enabled() -- odds ingest, decide, the placer loader and its
    # pre-flight. Absent means enabled, so football is untouched.
    enabled: false
    # 2026-05-02: scaled to 25 % of Browne default (user request — overall
    # 75 % stake reduction). Pre-cut: 0.20.
    kelly_frac: 0.05         # §7.2 multiplicative shrinkage; quarter-of-Browne
    max_match_stake: 0.50    # solver cap; rarely binds
    ev_threshold: 0.0
    markets:
      moneyline: true
      spread: true
      total: true
    scoring:
      has_ties: true
      tie_threshold: 0.5
    min_bet: 200
    max_age_hours: 48

football_iceland:
  sport: football
  country: iceland
  sexes: [male, female]
  active: true
  data_source:
    results: ksi_football
    schedule: ksi_football
    odds: lengjan_odds
  lengjan:
    competitions:
      - { id: "746",   name: "Besta Deildin",            sex: male   }
      - { id: "20443", name: "Besta Deildin Efri Hluti", sex: male   }
      - { id: "20442", name: "Besta Deildin Neðri Hluti", sex: male   }
      - { id: "757",   name: "Lengjudeildin",            sex: male   }
      - { id: "813",   name: "Mjólkurbikar karla",       sex: male   }
      - { id: "1581",  name: "2. deild karla",           sex: male   }
      - { id: "1568",  name: "Besta deild kvenna",       sex: female }
      # Women's cup — confirmed live 2026-06-16 (ÍBV kv v FH kv, 17 Jún) at
      # competition id 2410. Lengjan labels it "Mjólkurbikar kvenna"; the same
      # cell is "Bikar kvenna" on the publish side (publish_divisions.female.CUP).
      # Closes the female-CUP scrape gap: the cell was already trained +
      # published, just never bet. A cup is cross-divisional, so non-BD women's
      # sides will surface here unmapped — fill team_names.female opportunistically
      # as their odds first appear (same pattern as the women's BD map).
      - { id: "2410",  name: "Mjólkurbikar kvenna",      sex: female }
      # Women's Lengjudeild (1. deild kvenna) -- comp 4670, added 2026-06-21.
      # Division is already modelled + published (kvenna-ld); this wires the
      # odds scrape + placement that were the only missing layer. KR kv /
      # Haukar kv renderings confirmed from the 21 Jun scrape; remaining
      # team_names.female LD-women entries are pattern-guesses (verify as odds
      # appear, next round 27 Jun).
      - { id: "4670",  name: "Lengjudeild kv.",          sex: female }
      # Men's 3. deild (LD3) -- comp 3267, added 2026-06-25 via /wire-league.
      # Division already modelled + published (karla-3deild); this wires the
      # odds scrape + placement. Tindastóll / Sindri renderings CONFIRMED
      # high-confidence (identity, verified against
      # data/facts/results/sport=football/country=iceland). A cross-divisional
      # cup is not involved here, but further LD3 sides will surface unmapped as
      # their odds first appear -- fill team_names.male opportunistically.
      - { id: "3267",  name: "3. deild",                 sex: male   }
    team_names:
      male:
        # Existing LD1 + men-only sex-disjoint entries:
        Þór: Þór Ak.
        Víkingur R.: Víkingur Rvk
        Þróttur R.: Þróttur Rvk
        Leiknir R.: Leiknir Rvk
        Ægir: Ægir
        ÍR: ÍR
        Grótta: Grótta
        Grindavík: Grindavík
        Njarðvík: Njarðvík
        Völsungur: Völsungur
        Fylkir: Fylkir
        Vestri: Vestri
        # 2. deild karla teams. Most canonical == Lengjan rendering; two
        # diverge — see Víkingur Ó./Þróttur V. below. Confirmed names verified
        # against data/facts/odds/sport=football/country=iceland (scraped via
        # competition id 1581); unconfirmed teams use identity guess (KSÍ
        # schedule has them in LD2 but no Lengjan odds yet).
        KFG: KFG                       # confirmed
        Magni: Magni                   # confirmed
        Dalvík/Reynir: Dalvík/Reynir   # confirmed (no spaces around slash)
        KFA: KFA                       # confirmed
        Kormákur/Hvöt: Kormákur/Hvöt   # confirmed (no spaces around slash)
        Selfoss: Selfoss               # confirmed
        Víkingur Ó.: Víkingur Ól.      # confirmed — Lengjan uses "Ól.", KSÍ "Ó."
        Þróttur V.: Þróttur Vogum      # confirmed — Lengjan uses full village name
        Fjölnir: Fjölnir               # identity guess; verify on first odds appearance
        Haukar: Haukar                 # identity guess; verify on first odds appearance
        Hvíti riddarinn: Hvíti riddarinn  # identity guess; verify on first odds appearance
        Kári: Kári                     # identity guess; verify on first odds appearance
        # Additional men's teams surfacing in 2026-05-17 Lengjudeildin fixtures
        # (canonical == Lengjan rendering; verified against
        # data/facts/odds/sport=football/country=iceland).
        HK: HK
        Afturelding: Afturelding
        # BD teams that also appear in women's BD (verified against
        # data/facts/odds/sport=football/country=iceland):
        KR: KR
        FH: FH
        Stjarnan: Stjarnan
        Valur: Valur
        Fram: Fram
        ÍBV: ÍBV
        Breiðablik: Breiðablik
        Keflavík: Keflavík
        ÍA: ÍA
        KA: KA
        # 3. deild karla teams -- comp 3267, added 2026-06-25 via /wire-league.
        # Tindastóll / Sindri CONFIRMED high-confidence identity mappings
        # (verified against data/facts/results/sport=football/country=iceland).
        # Remaining LD3 sides will surface unmapped as their odds first appear;
        # add them opportunistically (a wrong guess fails safe -- decide
        # warn-and-skips, no mis-placed bet).
        Tindastóll: Tindastóll          # confirmed 2026-06-25
        Sindri: Sindri                  # confirmed 2026-06-25
        # 2026-06-26: remaining LD3 roster confirmed from data/facts/odds (first
        # 3. deild odds round posted, fixtures 26-28 Jun). All identity except
        # Víðir, which Lengjan renders with the town suffix "Víðir Garði"
        # (c.f. Þróttur V. -> Þróttur Vogum). Reynir S. keeps "S." on Lengjan
        # too (NOT "Reynir Sandgerði"). All 12 LD3 sides now mapped.
        Augnablik: Augnablik            # confirmed 2026-06-26
        KH: KH                          # confirmed 2026-06-26
        KV: KV                          # confirmed 2026-06-26
        Víðir: Víðir Garði              # confirmed 2026-06-26 (Lengjan adds town "Garði")
        Höttur: Höttur                  # confirmed 2026-06-26
        KF: KF                          # confirmed 2026-06-26
        KÁ: KÁ                          # confirmed 2026-06-26
        Reynir S.: Reynir S.            # confirmed 2026-06-26 (Lengjan keeps "S.", not "Sandgerði")
        Árbær: Árbær                    # confirmed 2026-06-26
        Ýmir: Ýmir                      # confirmed 2026-06-26
      female:
        # First women's BD season on Lengjan (Plan 1-era empty map upgraded
        # 2026-05-11 after odds for the first 5 teams appeared in
        # data/facts/odds/sport=football/country=iceland; 2026-05-18 audit
        # added the remaining 5 KSÍ-schedule teams). canonical (matches
        # beliefs/latest) -> Lengjan rendering.
        FH: FH kv                                       # confirmed
        Fram: Fram kv                                   # confirmed
        ÍBV: ÍBV kv                                     # confirmed
        Víkingur R.: Víkingur Rvk kv                    # confirmed
        Þróttur R.: Þróttur Rvk kv                      # confirmed
        Breiðablik: Breiðablik kv                       # confirmed 2026-05-18
        # Lengjan renders this women's team under two byte-distinct forms
        # (both verified in data/facts/odds): list them so the decode
        # (normalise_lengjan_team_names) accepts either and the placer
        # (resolve_bet_match_id) resolves whichever the live page shows.
        # First element is the primary the placer types into the bet slip.
        Grindavík/Njarðvík:
          - Grindavík / Njarðvík kv                     # primary: accented, SPACES around slash (confirmed 2026-05-18)
          - Grindavik/Njarðvík kv                       # variant: plain 'i', bare slash (confirmed 2026-06-16)
        Valur: Valur kv                                 # confirmed 2026-05-18
        Stjarnan: Stjarnan kv                           # identity-pattern guess; first fixture 2026-05-20 vs Grindavík/Njarðvík
        Þór/KA: Þór/KA kv                               # identity-pattern guess; first fixture 2026-05-20 vs Breiðablik. Verify on first odds appearance (Lengjan may use spaces — c.f. Grindavík/Njarðvík)
        # Women's Lengjudeild (1. deild kvenna) teams -- comp 4670, added
        # 2026-06-21. KR / Haukar renderings CONFIRMED (21 Jun scrape); the
        # other 8 are "<name> kv" pattern-guesses -- a wrong guess fails safe
        # (decide warn-and-skips, no mis-placed bet). Verify each as its odds
        # first appear. NB Tindastóll: basketball renders it "UMF Tindastoll
        # kv", so the football rendering may diverge from this guess.
        KR: KR kv                                       # confirmed 2026-06-21
        Haukar: Haukar kv                               # confirmed 2026-06-21
        FHL: FHL kv                                     # pattern guess; verify on first odds appearance
        Grótta: Grótta kv                               # confirmed 2026-06-26 (Grótta kv v Völsungur kv)
        HK: HK kv                                       # pattern guess; verify on first odds appearance
        Keflavík: Keflavík kv                           # pattern guess; verify on first odds appearance
        Selfoss: Selfoss kv                             # confirmed 2026-07-09 (Selfoss kv v KR kv)
        # Lengjan renders this women's side WITHOUT the accent ("Tindastoll kv"),
        # diverging from the canonical "Tindastóll" -- list both so the decode
        # accepts either (basketball uses yet another form, "UMF Tindastoll kv").
        Tindastóll:
          - Tindastoll kv                               # primary: plain 'o' -- CONFIRMED 2026-06-26 (KR kv v Tindastoll kv)
          - Tindastóll kv                               # variant: accented (fallback if Lengjan corrects)
        Völsungur: Völsungur kv                         # confirmed 2026-06-26 (Grótta kv v Völsungur kv)
        ÍA: ÍA kv                                       # pattern guess; verify on first odds appearance
  stan_model: football_iceland/bivariate_poisson_no_inflation.stan
  # Restrict Stan training to teams that have competed in the top four
  # league tiers within the last 365 days. Cuts ~30 amateur/regional teams
  # whose 1-2 cup blowouts (12-1, 10-0, 9-0) introduced funnel-shaped
  # curvature in the posterior — see Knowledge/Sports Models/2026-05-21 —
  # training-filter root cause.md for the full diagnosis. Lengjan doesn't
  # offer odds on LD4 or amateur-cup-only sides, so dropping them aligns
  # the training population with the prediction population.
  training_filter:
    divisions: [BD, BD_UPPER_PO, BD_LOWER_PO, LD1, LD2, LD3]
    lookback_days: 365
  # Per-sex publish surface. Drives extract_football_iceland()'s and
  # publish_football_iceland()'s loops, and is mirrored by the metill-platform
  # consumer's DIVISIONS dict. To add a division: ensure its `code` is in
  # `training_filter.divisions` AND has a (sex, division) partition in
  # `data/facts/results/`, then list it here. The `slug` is both the URL
  # segment on the consumer (/fotbolti/iceland/{sex}/{slug}/) AND the dir
  # suffix under data/publish/football/iceland/{sex_folder}-{slug}/.
  publish_divisions:
    male:
      # split: efri/neðri hluti after the 22-round regular phase — single RR
      # within each group, full carry-over, group-locked final table
      # (verified 2026-07-10; docs/superpowers/specs/
      # 2026-07-10-split-season-simulator-design.md).
      #
      # code_badge is the short ASCII filter key emitted as
      # next_games.json::division_code. The values below are lifted VERBATIM
      # from the retired R map .football_iceland_division_code_labels() and are
      # mirrored by metill-platform's DIVISIONS dict -- changing one requires
      # changing both. They exist in config (not R) so basketball's
      # Bónusdeild, also coded BD, can carry its own badge instead of
      # colliding with football's BD on the consumer's filter key.
      #
      # qualify.slots on BD is split.upper (6), so p_qualify reproduces the
      # existing p_top_six rule `placement <= 6L` exactly. No other football
      # cell has a qualification cut.
      - { code: BD,  slug: bd,     label_is: "Besta deild",   is_cup: false,
          code_badge: BD, qualify: { slots: 6, label_is: "Efri hluti" },
          split: { upper: 6, lower: 6 } }
      - { code: LD1, slug: ld,     label_is: "Lengjudeild",   is_cup: false,
          code_badge: LD }
      - { code: LD2, slug: 2deild, label_is: "2. deild",      is_cup: false,
          code_badge: D2 }
      - { code: LD3, slug: 3deild, label_is: "3. deild",      is_cup: false,
          code_badge: D3 }
      - { code: CUP, slug: bikar,  label_is: "Mjólkurbikar",  is_cup: true,
          code_badge: MB }
    female:
      # Women's split is asymmetric: 10 teams, 18 regular rounds, top 6 /
      # bottom 4 (upper single RR = 5 games, lower = 3), same carry-over +
      # group locking as the men's format (verified 2026-07-10).
      - { code: BD,  slug: bd,     label_is: "Besta deild",   is_cup: false,
          code_badge: BD, qualify: { slots: 6, label_is: "Efri hluti" },
          split: { upper: 6, lower: 4 } }
      - { code: LD1, slug: ld,     label_is: "Lengjudeild",   is_cup: false,
          code_badge: LD }
      - { code: LD2, slug: 2deild, label_is: "2. deild",      is_cup: false,
          code_badge: D2 }
      - { code: CUP, slug: bikar,  label_is: "Bikar kvenna",  is_cup: true,
          code_badge: MB }
  betting:
    # kelly_frac is the §7.2 multiplicative shrinkage. Female cell stays
    # tighter — first Icelandic women's football season, thin history.
    # 2026-05-02: scaled to 25 % of Browne defaults. Pre-cut: male 0.20, female 0.10.
    # 2026-06-05: restored to 50 % of Browne (male 0.10, female 0.05) after
    # current_pool was corrected from an inflated ~107k to the real 14,909
    # (PR #33). The 25 % cut was an artifact of the inflated pool, NOT an edge
    # judgement — at frac 0.05 on the real pool 0 % of bets cleared the 200-ISK
    # min_bet floor, so the placer placed nothing. Capped at HALF-Browne (not
    # full) because the forensic review found no demonstrable edge (football
    # 2026 -8.1 %, n=56). Raise toward full Browne only on a positive CLV signal.
    # Coupled with daily_budget_frac 0.10 in bankroll.yml (raising frac alone is
    # absorbed by the daily cap).
    kelly_frac:
      male: 0.10
      female: 0.05
    max_match_stake: 0.50
    ev_threshold: 0.0
    markets:
      moneyline: true
      spread: true
      total: true
    scoring:
      has_ties: true
      tie_threshold: 0
    min_bet: 200
    max_age_hours: 48
