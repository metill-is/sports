name: World Cup Forecast

# Automates the 2026 World Cup (HM 2026) forecast that was previously a manual
# local run of scripts/wc/{ingest,fit,forecast}.R. Mirrors fit.yml's R + CmdStan
# setup. Single job: the Stan fit lands in data/wc/fit/ (gitignored, ~900MB), so
# the forecast MUST consume it in the same run -- it can't be split across jobs.
#
# Downstream: this commits the 6 JSONs under data/publish/world_cup/karla/ to
# metill-is/sports. The metill-platform `pull-sports-data.yml` cron (hourly)
# already rsyncs the whole data/publish/ tree -> the /hm2026/ page, so no
# metill-platform change is needed; freshness latency is <=1h, same as the
# Icelandic football.

on:
  schedule:
    # Poll hourly, around the clock. The cheap SHA pre-gate (see the `gate` job)
    # turns a poll with no new martj42 commit into a sub-minute no-op -- it never
    # clones this ~11 GB repo or spins up R/CmdStan -- so frequent polling costs
    # almost nothing (and this repo is public, so Actions minutes are free too).
    #
    # Hourly, not the old 2x/day morning window, because during the live
    # tournament martj42 posts results across the whole UTC day: 2026 WC games
    # kick off in North-American afternoons/evenings -> late-UTC commits, not just
    # the ~05:00-10:04 UTC qualifier-update window the previous schedule targeted.
    # Detection latency is then <=1h; the downstream metill-platform rsync
    # (pull-sports-data.yml) is itself hourly, so polling faster buys nothing.
    #
    # Minute 17, not :00, to dodge the top-of-hour congestion that makes GitHub
    # delay (and sometimes drop) scheduled runs.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Forecast even if martj42 has no new results (bypass BOTH the SHA pre-gate and the facts-diff skip-guard)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: world-cup
  cancel-in-progress: false

jobs:
  # Cheap pre-gate. Two checks decide whether to spin up the expensive R + CmdStan
  # forecast job below, so the hourly cron is almost always a sub-minute no-op:
  #   1. Tournament window -- no-op past WC_END_DATE (the WC 2026 final is 19 Jul
  #      2026; after it the cron keeps firing but post-tournament friendlies would
  #      only perturb a finished bracket). Bump WC_END_DATE to re-arm (e.g. for the
  #      women's World Cup on a world_cup/kvenna/ data dir).
  #   2. martj42 SHA -- no-op unless martj42/international_results' master tip moved
  #      since the SHA we last acted on (stored in the tracked pointer file
  #      data/wc/martj42_pointer.txt, advanced by the forecast job).
  # Neither check clones this repo (~11 GB of committed data): the upstream tip
  # comes from `git ls-remote` and the pointer is read over raw.github (this repo
  # is public, so no auth). The data-level facts-diff in the forecast job stays as
  # the *precise* second gate -- this SHA gate only filters polls where martj42 did
  # not commit at all, so we never pay R setup on a dead poll.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      upstream_sha: ${{ steps.sha.outputs.upstream }}
    env:
      WC_END_DATE: '2026-07-20'
    steps:
      - id: window
        run: |
          today=$(date -u +%Y-%m-%d)
          if [[ "$today" > "$WC_END_DATE" ]]; then
            echo "past=true" >> "$GITHUB_OUTPUT"
          else
            echo "past=false" >> "$GITHUB_OUTPUT"
          fi

      - id: sha
        run: |
          # Retry a few times so a transient network blip on an hourly poll does
          # not fail the run (and email); only a genuine outage (martj42 gone, GH
          # unreachable for ~15s) escalates to a loud error.
          upstream=""
          for attempt in 1 2 3; do
            upstream=$(git ls-remote https://github.com/martj42/international_results.git refs/heads/master | cut -f1)
            [[ -n "$upstream" ]] && break
            echo "::warning::git ls-remote attempt $attempt returned nothing; retrying..."
            sleep 5
          done
          if [[ -z "$upstream" ]]; then
            echo "::error::Could not read martj42 upstream SHA via git ls-remote after 3 attempts."
            exit 1
          fi
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"

      - id: decide
        env:
          FORCE: ${{ inputs.force }}
          PAST: ${{ steps.window.outputs.past }}
          UPSTREAM: ${{ steps.sha.outputs.upstream }}
        run: |
          # The SHA we last acted on. raw.github 404s on the first ever run (no
          # pointer yet) or on any transient fetch error -> empty seen -> we fail
          # safe by proceeding (a redundant run is harmless; a skipped real update
          # is not). The repo is public, so no token is needed.
          seen=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data/wc/martj42_pointer.txt" 2>/dev/null || echo "")
          seen=$(printf '%s' "$seen" | tr -d '[:space:]')
          if [[ "$PAST" == "true" ]]; then
            echo "::notice::$(date -u +%F) is past WC_END_DATE ($WC_END_DATE) -- skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$FORCE" == "true" ]]; then
            echo "::notice::force=true -- proceeding regardless of martj42 SHA."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$seen" && "$UPSTREAM" == "$seen" ]]; then
            echo "::notice::martj42 unchanged (${UPSTREAM:0:7}) since last run -- skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::martj42 advanced (${seen:0:7} -> ${UPSTREAM:0:7}) -- proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  forecast:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CMDSTAN_VERSION: '2.38.0'

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          extra-repositories: 'https://stan-dev.r-universe.dev'
          extra-packages: |
            any::devtools
            any::cmdstanr

      - name: Reinstall V8 from source with bundled static libv8
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      - name: Cache CmdStan installation
        id: cache-cmdstan
        uses: actions/cache@v5
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-ubuntu-latest

      - name: Install CmdStan if not cached
        if: steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: Rscript -e 'cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)'

      - name: Ingest martj42 internationals into the facts store
        run: Rscript scripts/wc/ingest.R

      - name: Decide whether a refit is needed
        id: refit
        env:
          FORCE: ${{ inputs.force }}
        run: |
          # The ingest rewrites the country=world facts Parquets. If git sees no
          # change, martj42 brought no new in-window, WC-relevant results since
          # the last run -> nothing to refit, skip the expensive fit + forecast.
          # (The first CI run may refit once if the runner's arrow build writes
          # byte-different Parquets than the locally-committed ones; it settles
          # to a clean no-op thereafter.)
          paths='data/facts/results/sport=football/country=world data/facts/schedules/sport=football/country=world'
          if [[ "$FORCE" == "true" ]]; then
            echo "::notice::force=true -- refitting regardless of facts diff."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif git status --porcelain $paths | grep -q .; then
            echo "::notice::Facts store changed -- refitting."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No new internationals -- skipping fit + forecast."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fit the bivariate-Poisson model on internationals
        if: steps.refit.outputs.needed == 'true'
        run: Rscript scripts/wc/fit.R

      - name: Simulate + publish the forecast JSONs
        if: steps.refit.outputs.needed == 'true'
        run: Rscript scripts/wc/forecast.R

      # Runs on every proceeding poll (the job's `if` already requires proceed).
      # Advancing the pointer is NOT gated on refit.needed: even when the
      # facts-diff found nothing to refit, we must record the SHA we just
      # processed, or every later poll would see "changed" and needlessly
      # re-ingest. On a no-refit run only the pointer is staged -> a tiny
      # pointer-only commit. (If martj42 commits again between the gate's read and
      # here, the pointer lags by one commit and the next poll re-runs -- harmless,
      # the facts-diff no-ops it.)
      - name: Advance martj42 pointer + commit any new outputs
        env:
          UPSTREAM_SHA: ${{ needs.gate.outputs.upstream_sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$UPSTREAM_SHA" > data/wc/martj42_pointer.txt
          # Stage every output by OWNED SUBTREE, not by enumerated leaf. These
          # four roots are world-cup-exclusive (the disjoint-path invariant in
          # git-hygiene.md): no other workflow writes under them, and the
          # gitignored children (data/wc/{raw,fit}/, forecast.html, gisko/) are
          # skipped by `git add`. Staging whole subtrees means a future new WC
          # output is committed automatically -- a leaf-list `git add` silently
          # rotted when Phase 2 added data/wc/shootouts.csv, which scripts/wc/
          # ingest.R rewrites every run: it escaped the stage, left the tree
          # dirty after commit, and the rebase below aborted with "cannot rebase:
          # You have unstaged changes" (run 28437698745, 2026-06-30). The
          # coverage contract is pinned by test-wc-workflow-staging.R.
          git add data/wc/ \
                  data/publish/world_cup/ \
                  data/facts/results/sport=football/country=world \
                  data/facts/schedules/sport=football/country=world
          if git diff --cached --quiet; then
            echo "Nothing to commit (pointer already current, no new outputs)"
            exit 0
          fi
          git commit -m "data(wc): forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          # Defence in depth: the rebase below refuses to run with a dirty tree
          # (the exact 2026-06-30 symptom). After staging the owned subtrees the
          # tree must be clean; if a tracked change still lingers it means the
          # pipeline grew an output OUTSIDE the four owned roots -- surface it
          # loudly with the offending paths instead of git's opaque "cannot
          # rebase: You have unstaged changes" / "no rebase in progress" cascade.
          if ! git diff --quiet; then
            echo "::error::WC output landed outside the staged subtrees -- add it to the git-add block above:"
            git status --porcelain
            exit 1
          fi
          # Conflict-aware push. The league workflows each write DISJOINT paths,
          # so a plain rebase never hits a content conflict -- but TWO world-cup
          # runs (e.g. the hourly cron overlapping a forced/manual run) regenerate
          # the SAME files here: data/publish/world_cup/, the accretive
          # prediction_log.json, the pointer, and the country=world facts. The
          # `concurrency: world-cup` group serialises runs only loosely, so a
          # checkout-vs-remote-push race of seconds can leave our commit
          # conflicting with a sibling run's (this is what failed run
          # 28364002549). Every path this job writes is world-cup-exclusive and
          # fully regenerated from the latest martj42 data + this run's fit, so
          # OURS is the authoritative, freshest forecast: rebase preferring ours
          # (`-X theirs` replays our commit, keeping its side on conflict), and
          # retry in case origin advances again between fetch and push.
          #
          # Caveat: prediction_log.json is accretive. In the rare window where a
          # fixture is played between two overlapping runs, a sibling's pre-match
          # snapshot for that one match could be dropped. The match result itself
          # is never lost (it lives in data/facts/results) and the next fit
          # re-snapshots every still-upcoming fixture -- whereas the prior
          # behaviour threw away the entire ~49-min forecast on any conflict.
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X theirs FETCH_HEAD; then
              echo "::error::Unexpected non-content rebase failure (attempt $attempt)."
              git rebase --abort || true
              exit 1
            fi
            if git push; then
              echo "Pushed forecast outputs on attempt $attempt."
              pushed=1
              break
            fi
            echo "::warning::Push rejected (origin advanced); retrying (attempt $attempt)."
            sleep $((attempt * 3))
          done
          if [[ "$pushed" -ne 1 ]]; then
            echo "::error::Could not push forecast outputs after 5 attempts."
            exit 1
          fi
