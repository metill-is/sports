name: Decide + Publish

on:
  workflow_run:
    workflows: ["Fit Stan Models", "Scrape Lengjan Odds"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: decide-publish
  cancel-in-progress: false

jobs:
  decide-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          extra-packages: |
            any::devtools

      - name: Reinstall V8 from source with bundled static libv8
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      - name: Decide (Kelly + portfolio + calibration)
        run: Rscript scripts/04_decide.R

      - name: Publish JSONs
        run: Rscript scripts/05_publish.R

      - name: Commit if outputs changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/decisions/candidates/ data/decisions/recommendations/ data/publish/ data/beliefs/round_predictions_history/
          if git diff --cached --quiet; then
            echo "No decisions or publish JSONs changed"
            exit 0
          fi
          git commit -m "data: decide + publish $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
