name: Womens World Cup 2027 Play-off

# Automatic refresh of the 2027 Women's World Cup UEFA play-off forecast
# (round 2: first legs Tuesday 1 December 2026, second legs Saturday 5
# December) on its leg nights, so no session is needed after the whistle
# (owner, 27 November 2026: "Set up automatic data updates like for the
# others sports leagues").
#
# Each run reads the round-2 matches from UEFA's public match feed, fills
# finished legs into data/wc/structure/wwc2027_playoff_round2.csv (first leg:
# the 90-minute score; second leg: the tie's winner, extra time and penalties
# included) and, only when that table changed, republishes
# data/publish/world_cup/kvenna/ from the compact pre-leg fit
# data/wc/wwc2027/playoff_fit.rds (scripts/nt/wwc2027_auto_playoff.R; the
# same code path as the manual scripts/nt/wwc2027_publish_playoff.R). No
# refit and no R-INLA: a first-leg score reweights draws whose data predate
# the legs, and a runner's INLA build would not reproduce the Mac's draws.
# Then metill-platform's pull is dispatched, as ih-tournament.yml does, with
# the same scoped token in the same environment (ih-refresh, main only).
#
# Polls every 15 minutes from 15:00 to 23:59 UTC on 1 and 5 December (kick-
# offs 14:00 to 20:15 UTC) and every two hours the morning after, in case the
# feed is late or GitHub drops a scheduled run. The cron repeats every year:
# the window step stops scheduled runs after LAST_DAY.
#
# Dispatch with `simulate` (leg1 or leg2) for a dry run on a saved, simulated
# feed (tests/testthat/fixtures/wwc2027/): it writes into the checkout, uploads
# the files as an artifact, and never commits or dispatches.
# A live run commits only on main (from another branch it does no more than a
# dry run). Pinned by tests/testthat/test-nt-wwc2027-auto.R.

on:
  schedule:
    - cron: '*/15 15-23 1,5 12 *'
    - cron: '30 0-12/2 2,6 12 *'
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Dry run on a saved, simulated feed (artifact only, never commits)'
        type: choice
        options:
          - none
          - leg1
          - leg2
        default: none
      force:
        description: 'Republish even if no result changed (live only)'
        type: boolean
        default: false

# Least privilege: nothing at the top; each job asks for what it needs.
permissions: {}

concurrency:
  group: wwc2027-playoff
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.publish.outputs.changed }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LAST_DAY: '2026-12-07'
      SIMULATE: ${{ inputs.simulate || 'none' }}
      FORCE: ${{ inputs.force || false }}

    steps:
      - name: Check the window
        id: window
        run: |
          today=$(date -u +%Y-%m-%d)
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$today" > "$LAST_DAY" ]]; then
            echo "::notice::$today is past LAST_DAY ($LAST_DAY): the play-off is over, nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.window.outputs.proceed == 'true'

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: steps.window.outputs.proceed == 'true'
        with:
          r-version: '4.5.3' # pinned to local R, not 'release' (ci-conventions.md section 3)
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: steps.window.outputs.proceed == 'true'
        env:
          PKG_SYSREQS: "false"
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::devtools

      - name: Reinstall V8 from source with bundled static libv8
        if: steps.window.outputs.proceed == 'true'
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      - name: Read the results and republish if they changed
        id: publish
        if: steps.window.outputs.proceed == 'true'
        run: |
          case "$SIMULATE" in
            none)
              if [ "$FORCE" = "true" ]; then
                Rscript scripts/nt/wwc2027_auto_playoff.R --force
              else
                Rscript scripts/nt/wwc2027_auto_playoff.R
              fi ;;
            leg1|leg2)
              Rscript scripts/nt/wwc2027_auto_playoff.R "--uefa-json=tests/testthat/fixtures/wwc2027/uefa_round2_${SIMULATE}_simulated.json" ;;
            *) echo "unknown simulate: $SIMULATE"; exit 1 ;;
          esac

      - name: Upload the dry run
        if: steps.window.outputs.proceed == 'true' && env.SIMULATE != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wwc2027-playoff-${{ env.SIMULATE }}
          path: |
            data/wc/structure/wwc2027_playoff_round2.csv
            data/publish/world_cup/kvenna/
          retention-days: 30

      # Only the ties table and the women's publish folder are staged; nothing
      # else in this repository writes either (world-cup.yml, dispatch-only,
      # stages all of data/wc/ and data/publish/world_cup/ but writes only
      # world_cup/karla/ and its own data/wc/ files).
      - name: Commit the forecast
        if: steps.window.outputs.proceed == 'true' && env.SIMULATE == 'none' && steps.publish.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/wc/structure/wwc2027_playoff_round2.csv data/publish/world_cup/kvenna/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "data(wc): women's play-off forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          .github/scripts/push-with-retry.sh

  notify:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true' && (inputs.simulate || 'none') == 'none' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ih-refresh
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Dispatch metill-platform's pull
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
        run: gh workflow run pull-sports-data.yml --repo metill-is/metill-platform --ref main
