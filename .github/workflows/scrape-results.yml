name: Scrape Federation Results and Schedules

on:
  schedule:
    - cron: '0 6 * * *'   # 1x daily UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-results
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::devtools
            any::chromote

      - name: Reinstall V8 from source with bundled static libv8
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      - name: Refresh active_competitions
        run: Rscript scripts/00_active_competitions.R

      - name: Scrape results + schedules
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: Rscript scripts/01_ingest_results.R

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/facts/results/ data/facts/schedules/ config/active_competitions.json
          if git diff --cached --quiet; then
            echo "No data changed"
            exit 0
          fi
          git commit -m "data: federation scrape $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
