name: Fit Stan Models

on:
  workflow_run:
    workflows: ["Scrape Federation Results and Schedules"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Pass --force to scripts/03_fit.R (refit every league regardless of needs_refit())"
        type: boolean
        default: false
      league:
        description: "Restrict to one league (e.g. football_iceland). Empty = all active leagues."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: fit
  cancel-in-progress: false

jobs:
  fit:
    # Same contract as decide-publish.yml: a partially failed upstream still
    # committed real data. scrape-results is fit's ONLY scheduled trigger (1x
    # daily), so gating on `success` here means one federation scraper erroring
    # costs a whole day of fits for every league with no fallback path.
    # 03_fit.R re-reads the facts store and skips cells with no new results, so
    # running against a partial scrape is safe and usually a no-op.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success'
          || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    # 360 is GitHub's ceiling for a hosted job. Football alone took 196 min on
    # 2026-08-28 (male 126, female 70), and a slow runner cancelled a
    # football-only run at 241 min on 2026-08-19; the six-target day adds four
    # 2DT fits on top of that. run_fit_targets() fits the betting league first
    # so a timeout cuts a publish-only target, and the commit step below still
    # commits whatever did fit. test-pipeline-run-isolation.R pins this value.
    timeout-minutes: 360

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CMDSTAN_VERSION: '2.38.0'
      # R-INLA for the football v2 engine (engine: inla). The same pin and
      # repository as inla-engine.yml; test-workflow-inla-engine.R keeps the
      # two equal. No league uses the engine yet: installed so the install is
      # exercised on this runner before one does.
      INLA_VERSION: '25.06.07'
      INLA_REPO: 'https://inla.r-inla-download.org/R/stable'

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3' # pinned to local R, not 'release' (ci-conventions.md section 3)
          use-public-rspm: true
          # stan-dev r-universe is read by setup-r (it configures the repos),
          # NOT setup-r-dependencies@v2 -- which silently ignores
          # extra-repositories and logs an "Unexpected input(s)" annotation.
          extra-repositories: 'https://stan-dev.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          extra-packages: |
            any::devtools
            any::cmdstanr

      - name: Reinstall V8 from source with bundled static libv8
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      # R-INLA for the football v2 engine, the same steps as inla-engine.yml.
      # While no league has `engine: inla` these steps are continue-on-error:
      # an outage at R-INLA's host or an apt mirror must not cost a day of
      # Stan fits. The commit that switches a league removes it, and
      # test-workflow-inla-engine.R fails if either half is out of step.
      # INLA imports fmesher, which imports sf, and sf's binary loads GDAL,
      # GEOS, PROJ and udunits; pak's system-requirements step is off
      # (ci-conventions.md section 1), so they are installed here.
      - name: "R-INLA: install the system libraries sf loads"
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      # Kept out of the fit's own dependency step, so a failure here cannot
      # stop that step. sn: INLA only suggests it, but its posterior sampler
      # stops without it.
      - name: "R-INLA: install its R dependencies"
        continue-on-error: true
        run: |
          Rscript -e 'install.packages(c("fmesher", "MatrixModels", "sn"))'

      # Not on CRAN and not in DESCRIPTION (pak does not read
      # Additional_repositories). The repository serves one tarball per
      # release, so the pin is the file name.
      - name: "R-INLA: install the pinned version"
        continue-on-error: true
        run: |
          Rscript -e 'install.packages(sprintf("%s/src/contrib/INLA_%s.tar.gz", Sys.getenv("INLA_REPO"), Sys.getenv("INLA_VERSION")), repos = NULL, type = "source")'
          Rscript -e 'stopifnot(packageVersion("INLA") == Sys.getenv("INLA_VERSION")); cat("INLA", as.character(packageVersion("INLA")), "\n")'

      # packageVersion() reads DESCRIPTION without loading the package; a fit
      # loads INLA, fmesher and sf, and runs R-INLA's binary.
      - name: "R-INLA: check that it fits a model at all"
        continue-on-error: true
        run: |
          Rscript -e 'set.seed(1); r <- INLA::inla(y ~ 1, data = data.frame(y = rnorm(50, 2)), num.threads = "1:1"); print(r$summary.fixed); stopifnot(abs(r$summary.fixed$mean - 2) < 1)'

      # ~/.cmdstan holds compiled objects (main.o, libtbb, the precompiled
      # header) that every model is linked against, so a cached copy is only
      # valid on the image and compiler that built it. The key carries both, so
      # a moved `ubuntu-latest` is a cache miss and CmdStan is rebuilt in place
      # (ci-conventions.md section 4, test-workflow-cmdstan-cache.R).
      - name: Identify the runner image for the CmdStan cache key
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-$(uname -m)-gcc$(g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Cache CmdStan installation
        id: cache-cmdstan
        uses: actions/cache@v5
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ steps.image.outputs.id }}

      - name: Install CmdStan if not cached
        if: steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: Rscript -e 'cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)'

      - name: Fit (skips when no new games unless --force)
        env:
          FORCE_FLAG: ${{ inputs.force == true && '--force' || '' }}
          LEAGUE_FLAG: ${{ inputs.league != '' && format('--league {0}', inputs.league) || '' }}
        run: Rscript scripts/03_fit.R $FORCE_FLAG $LEAGUE_FLAG

      - name: Commit if beliefs changed
        # A partially failed fit run exits non-zero (one 2DT diagnostics-gate
        # abort must not hide the targets that DID fit), but the posteriors it
        # wrote are real and are the publish input. Without always(), a red run
        # throws away football's fit along with basketball's failure.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/beliefs/latest/ data/beliefs/archive/ data/beliefs/extracts/
          # diagnostics/ is absent on skip-only fit runs (only a real fit writes it);
          # tolerate the missing pathspec so a no-op fit doesn't fail the workflow
          # (the failure email is the health alert channel -- keep it signal, not noise)
          git add data/beliefs/diagnostics/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new fits"
            exit 0
          fi
          git commit -m "data: stan fit $(date -u +%Y-%m-%dT%H:%MZ)"
          # Concurrent sibling workflows push to main constantly; retry the
          # fetch/rebase/push cycle instead of losing the run to a race.
          # --prefer-ours: two fit runs in this concurrency group can fit the
          # same cell on the same day (the queued run's checkout predates the
          # running run's push by seconds), and both write the same
          # fit_date=<today> partition. Run 33960811873 (2026-09-05) fitted
          # handball's first two cells of the season and then lost the whole
          # commit to a binary add/add conflict on football's parquets. Every
          # path staged above is regenerated from the freshest data by the run
          # that writes it, so the later fit is authoritative.
          .github/scripts/push-with-retry.sh --prefer-ours
