name: Fit Stan Models

on:
  workflow_run:
    workflows: ["Scrape Federation Results and Schedules"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Pass --force to scripts/03_fit.R (refit every league regardless of needs_refit())"
        type: boolean
        default: false
      league:
        description: "Restrict to one league (e.g. football_iceland). Empty = all active leagues."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: fit
  cancel-in-progress: false

jobs:
  fit:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # 360 is GitHub's ceiling for a hosted job. Football alone took 196 min on
    # 2026-08-28 (male 126, female 70), and a slow runner cancelled a
    # football-only run at 241 min on 2026-08-19; the six-target day adds four
    # 2DT fits on top of that. run_fit_targets() fits the betting league first
    # so a timeout cuts a publish-only target, and the commit step below still
    # commits whatever did fit. test-pipeline-run-isolation.R pins this value.
    timeout-minutes: 360

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CMDSTAN_VERSION: '2.38.0'

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          extra-repositories: 'https://stan-dev.r-universe.dev'
          extra-packages: |
            any::devtools
            any::cmdstanr

      - name: Reinstall V8 from source with bundled static libv8
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      - name: Cache CmdStan installation
        id: cache-cmdstan
        uses: actions/cache@v5
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-ubuntu-latest

      - name: Install CmdStan if not cached
        if: steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: Rscript -e 'cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)'

      - name: Fit (skips when no new games unless --force)
        env:
          FORCE_FLAG: ${{ inputs.force == true && '--force' || '' }}
          LEAGUE_FLAG: ${{ inputs.league != '' && format('--league {0}', inputs.league) || '' }}
        run: Rscript scripts/03_fit.R $FORCE_FLAG $LEAGUE_FLAG

      - name: Commit if beliefs changed
        # A partially failed fit run exits non-zero (one 2DT diagnostics-gate
        # abort must not hide the targets that DID fit), but the posteriors it
        # wrote are real and are the publish input. Without always(), a red run
        # throws away football's fit along with basketball's failure.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/beliefs/latest/ data/beliefs/archive/ data/beliefs/extracts/
          # diagnostics/ is absent on skip-only fit runs (only a real fit writes it);
          # tolerate the missing pathspec so a no-op fit doesn't fail the workflow
          # (the failure email is the health alert channel -- keep it signal, not noise)
          git add data/beliefs/diagnostics/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new fits"
            exit 0
          fi
          git commit -m "data: stan fit $(date -u +%Y-%m-%dT%H:%MZ)"
          # Concurrent sibling workflows push to main constantly; retry the
          # fetch/rebase/push cycle instead of losing the run to a race.
          # --prefer-ours: two fit runs in this concurrency group can fit the
          # same cell on the same day (the queued run's checkout predates the
          # running run's push by seconds), and both write the same
          # fit_date=<today> partition. Run 33960811873 (2026-09-05) fitted
          # handball's first two cells of the season and then lost the whole
          # commit to a binary add/add conflict on football's parquets. Every
          # path staged above is regenerated from the freshest data by the run
          # that writes it, so the later fit is authoritative.
          .github/scripts/push-with-retry.sh --prefer-ours
