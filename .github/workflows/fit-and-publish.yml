name: Fit + Decide + Publish

on:
  schedule:
    - cron: '0 7 * * *'   # 1x daily UTC, after results scrape
  workflow_dispatch: {}

permissions:
  contents: write

# Avoid two cron-triggered runs piling up if a previous run is still going.
# In-progress runs are NOT cancelled -- a 1.5h fit that just started should
# not be killed by the next dispatch.
concurrency:
  group: fit-and-publish
  cancel-in-progress: false

jobs:
  fit:
    # Per-league matrix: each (league) job runs fit + decide + publish for
    # both sexes of that league via run.R --league $LEAGUE. Three parallel
    # jobs replace the previous monolithic 3-5h run -- failure of one league's
    # publish (or hitting a per-job timeout) no longer kills the work for the
    # other two. Each job has its own targets cache scoped to its league.
    strategy:
      fail-fast: false
      matrix:
        league:
          - football_iceland
          - basketball_iceland
          - handball_iceland

    runs-on: ubuntu-latest
    # Per-league fit takes 30-90 min cold + cheap decide/publish; 120 min
    # gives margin. The previous 350m monolith was needed because all six
    # (league x sex) fits ran serially; we now parallelise across leagues.
    timeout-minutes: 120

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CMDSTAN_VERSION: '2.38.0'
      # Temporary: cut iter counts while we iterate on the workflow itself.
      # Drop these two env vars (or set to 1000) once the pipeline is stable
      # and we want production-quality posteriors back. fit_league() falls
      # back to 1000 each when the vars are unset.
      SPORTS_FIT_ITER_WARMUP: '100'
      SPORTS_FIT_ITER_SAMPLING: '100'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-repositories: 'https://stan-dev.r-universe.dev'
          extra-packages: |
            any::devtools
            any::targets
            any::tidyselect
            any::cmdstanr

      - name: Cache CmdStan installation
        id: cache-cmdstan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-ubuntu-latest

      - name: Install CmdStan if not cached
        if: steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: |
          Rscript -e 'cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)'

      - name: Restore targets cache (per league)
        # Per-league cache keys mean a Stan-model change to one league does
        # not invalidate the others' caches. The hashFiles still includes
        # all of R/ since cross-cutting helpers like R/model-* are shared,
        # but a typo fix in publish-football won't force basketball/handball
        # to refit from scratch -- targets itself only refits when its
        # own dependencies change.
        uses: actions/cache@v4
        with:
          path: _targets
          key: targets-${{ matrix.league }}-${{ hashFiles('_targets.R', 'R/**', 'config/**', format('Stan/{0}/**', matrix.league)) }}
          restore-keys: |
            targets-${{ matrix.league }}-

      - name: Fit + decide + publish (${{ matrix.league }})
        run: |
          Rscript run.R --league "${{ matrix.league }}" --step fit
          Rscript run.R --league "${{ matrix.league }}" --step decide
          Rscript run.R --league "${{ matrix.league }}" --step publish

      - name: Commit if data changed
        run: |
          set -e
          LEAGUE="${{ matrix.league }}"
          # league key is "<sport>_<country>"; we publish per sport directory.
          SPORT="${LEAGUE%_*}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Scope adds to this league's sport partition only -- avoids touching
          # other matrix jobs' files between their write and our commit. Skip
          # paths that don't exist yet (e.g. on first decide-only failure
          # the recommendations partition won't be there).
          for p in \
            "data/beliefs/latest/sport=$SPORT/" \
            "data/beliefs/archive/sport=$SPORT/" \
            "data/decisions/candidates/sport=$SPORT/" \
            "data/decisions/recommendations/sport=$SPORT/" \
            "data/publish/$SPORT/"; do
            if [ -d "$p" ]; then git add -A "$p"; fi
          done

          if git diff --cached --quiet; then
            echo "No data changed for $LEAGUE"
            exit 0
          fi

          git commit -m "data: fit/decide/publish $LEAGUE $(date -u +%Y-%m-%dT%H:%MZ)"

          # Three matrix jobs may finish near simultaneously and race on the
          # main branch. Retry pull --rebase + push with backoff. Five attempts
          # is plenty -- the rebase only ever has at most two unrelated peer
          # commits ahead of us.
          #
          # --autostash: targets reruns the always-cue ingest_<league> upstream
          # of --step fit, which leaves unstaged rewrites in data/facts/* that
          # this workflow has no business committing (scrape-results owns those
          # paths). Plain `pull --rebase` errors out with "cannot pull with
          # rebase: You have unstaged changes". --autostash stashes everything
          # unstaged before the rebase, pops it afterwards; if the pop conflicts
          # we still have our commit applied and pushable.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            backoff=$((RANDOM % 15 + 5))
            echo "Push attempt $attempt failed; sleeping ${backoff}s"
            sleep "$backoff"
          done

          echo "Failed to push $LEAGUE data after 5 attempts"
          exit 1
