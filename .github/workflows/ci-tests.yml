name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Same pin as fit.yml / world-cup.yml, and the same cache key below, so a
      # PR run restores the toolchain those workflows already built on main.
      CMDSTAN_VERSION: '2.38.0'

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3' # pinned to local R, not 'release' (ci-conventions.md section 3)
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::devtools
            any::testthat

      - name: Reinstall V8 from source with bundled static libv8
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      # Without the cmdstan toolchain, test-stan-compile.R and the fit_model
      # test in test-model-fit.R both skip ("cmdstan not installed"), so no
      # Stan model was compiled by any CI run: a broken .stan file passed green.
      # The cmdstanr R package already arrives via DESCRIPTION's
      # `Remotes: stan-dev/cmdstanr`; only the toolchain was missing.
      # `ubuntu-latest` is a moving label: it became Ubuntu 26.04 on 2026-11-12.
      # A key that says only "ubuntu-latest" then restores a CmdStan built on
      # the previous image, and the chains of every model compiled against it
      # abort (return code -6; test-simulate-2dt-equivalence.R, red on main
      # since that day). Naming the image in the key makes a new image build
      # its own toolchain. fit.yml and world-cup.yml still use the old key and
      # need the same change; that belongs to a fix on main, not to this PR.
      - name: Name the runner image for the CmdStan cache key
        run: echo "RUNNER_IMAGE=${ImageOS:-$(. /etc/os-release && echo "$ID$VERSION_ID")}" >> "$GITHUB_ENV"

      - name: Cache CmdStan installation
        id: cache-cmdstan
        uses: actions/cache@v5
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ env.RUNNER_IMAGE }}

      - name: Install CmdStan if not cached
        if: steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: Rscript -e 'cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)'

      - name: Run tests
        run: |
          Rscript -e 'devtools::test(stop_on_failure = TRUE)'
