name: Scrape Lengjan Odds

on:
  schedule:
    # 4x daily UTC. The 11:00 slot exists because Lengjan sometimes posts
    # same-day odds late morning (2026-06-10: posted ~11:00 for evening
    # kickoffs) -- without it those odds wait for the 14:00 cycle, recs
    # regenerate hours later, and the 12:00 healthcheck can false-FAIL on
    # "fixture today, no odds scraped".
    - cron: '0 8,11,14,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-odds
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::devtools
            any::chromote

      - name: Reinstall V8 from source with bundled static libv8
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      - name: Scrape Lengjan odds
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: Rscript scripts/02_scrape_odds.R

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/facts/odds/
          if git diff --cached --quiet; then
            echo "No data changed"
            exit 0
          fi
          git commit -m "data: odds scrape $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
