name: Scrape Lengjan Odds

on:
  schedule:
    # 5x daily UTC at minute 17, not :00 -- GitHub queues :00 crons hardest
    # and this job ran 2-4.5h behind them (2026-09-08), so the 11:00 slot
    # (Lengjan posts same-day odds late morning, 2026-06-10) was rarely
    # honoured. 17:17 adds a pre-kickoff snapshot for Icelandic evening games,
    # whose handball odds may post only on matchday (spec 2026-09-23 WS9).
    - cron: '17 8,11,14,17,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-odds
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::devtools
            any::chromote

      - name: Reinstall V8 from source with bundled static libv8
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      - name: Scrape Lengjan odds
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: Rscript scripts/02_scrape_odds.R

      - name: Commit if data changed
        # Commit even when the scrape step failed: scripts/02_scrape_odds.R
        # isolates each league (run_per_league()) and exits non-zero if ANY
        # failed, but the odds the other leagues wrote are real and cannot be
        # re-scraped later. Not always(): a cancelled run commits nothing.
        if: success() || failure()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/facts/odds/
          if git diff --cached --quiet; then
            echo "No data changed"
            exit 0
          fi
          git commit -m "data: odds scrape $(date -u +%Y-%m-%dT%H:%MZ)"
          # Concurrent sibling workflows push to main constantly; retry the
          # fetch/rebase/push cycle instead of losing the run to a race.
          .github/scripts/push-with-retry.sh
