name: Discover Lengjan Leagues

on:
  schedule:
    # Twice weekly (Mon + Thu) UTC, off the odds-scrape slots (8,11,14,20) and
    # the healthcheck slots. Competitions appear at most a few times per season,
    # so a daily poll was ~30x oversampling: cut 2026-09-02 alongside retiring
    # the WC cron. Two slots rather than one because GitHub is currently dropping
    # ~70% of scheduled triggers, so a single weekly slot would really fire about
    # monthly. A missed discovery costs at most a few days' delay before a new
    # competition is proposed -- nothing downstream is deadline-bound on it.
    - cron: '40 6 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: discover-leagues
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::devtools
            any::chromote

      - name: Reinstall V8 from source with bundled static libv8
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      - name: Discover Lengjan leagues
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: Rscript scripts/0N_discover.R

      - name: Commit if discovery changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/discovery/
          if git diff --cached --quiet; then
            echo "No discovery change"
            exit 0
          fi
          git commit -m "data(discovery): refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # Concurrent sibling workflows push to main constantly; retry the
          # fetch/rebase/push cycle instead of losing the run to a race.
          .github/scripts/push-with-retry.sh
