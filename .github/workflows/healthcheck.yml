name: Health Check

on:
  schedule:
    # Twice daily UTC. The morning slot must land AFTER the day's first odds
    # scrape (cron 08:00) and the fit chain (results 06:00 + ~1.5h fit):
    # Lengjan sometimes posts same-day odds late morning, and GitHub cron
    # drift runs 0.5-4h, so the old 07:00 slot fired before the first scrape
    # and false-FAILed odds_freshness on every such match day (2026-06-10).
    # 12:00 keeps a >=4h cron-offset margin over the 08:00 scrape; the 11:00
    # scrape-odds slot shrinks the residual race against odds Lengjan posts
    # AFTER the morning scrape ran (drift can still order 12:00+drift before
    # 11:00+drift -- accepted residual, alert channel only).
    # Accepted trade-off: the day's first alert lands after 1-2 unattended
    # local placement cycles (the local agent runs 09-22); stakes in that
    # window are bounded by the daily budget cap and P4's EV re-check.
    - cron: '0 12,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::devtools

      - name: Reinstall V8 from source with bundled static libv8
        env:
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          Rscript -e 'install.packages("V8", type = "source", repos = c(CRAN = "https://cloud.r-project.org"))'

      - name: Compute health snapshot
        run: Rscript scripts/07_healthcheck.R

      # Best-effort: record the diffable status file. A push race with another
      # workflow must not turn the health run red, so this never fails the job;
      # the alert below reads the locally-computed status regardless.
      - name: Commit status if changed
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/health/
          if git diff --cached --quiet; then
            echo "Health status unchanged"
          else
            git commit -m "data: health snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            # Concurrent sibling workflows push to main constantly; retry the
            # fetch/rebase/push cycle instead of losing the run to a race.
            .github/scripts/push-with-retry.sh
          fi

      # The alert: fail the run (-> GitHub failure email) when overall is FAIL.
      - name: Alert on breach
        if: always()
        run: |
          overall=$(jq -r '.overall' data/health/status.json)
          echo "Overall pipeline health: $overall"
          if [ "$overall" = "FAIL" ]; then
            echo "::error::Pipeline health is FAIL — inspect data/health/status.json"
            exit 1
          fi
